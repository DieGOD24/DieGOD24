<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-label="Cómo fluye una conversación: cliente, entrada, reglas, agente de IA, herramientas y persona en el circuito">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker></defs>
<rect width="1100" height="310" rx="16" fill="#0b1220"/>
<text x="30" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">Cómo fluye una conversación en los sistemas que construyo</text>
<line x1="170" y1="110.0" x2="210" y2="110.0" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="360" y1="110.0" x2="400" y2="110.0" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="595" y1="110.0" x2="635" y2="110.0" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="850" y1="110.0" x2="885" y2="110.0" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M742,150 L742,215" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#b)"/><circle r="6" fill="#fff"><animateMotion dur="9s" begin="0.0s" repeatCount="indefinite" path="M100,110.0 L285,110.0 L497,110.0 L742,110.0 L982,110.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="9s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="6" fill="#fff"><animateMotion dur="9s" begin="4.5s" repeatCount="indefinite" path="M100,110.0 L285,110.0 L497,110.0 L742,110.0 L982,110.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="9s" begin="4.5s" repeatCount="indefinite"/></circle><circle r="5" fill="#f472b6"><animateMotion dur="3.2s" begin="1s" repeatCount="indefinite" path="M742,150 L742,215"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle><rect x="30" y="70" width="140" height="80" rx="12" fill="#111c2e" stroke="#60a5fa" stroke-width="2" /><text x="100.0" y="106.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Cliente</text><text x="100.0" y="126.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#60a5fa">chat de WhatsApp</text><rect x="210" y="70" width="150" height="80" rx="12" fill="#111c2e" stroke="#60a5fa" stroke-width="2" /><text x="285.0" y="106.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Entrada</text><text x="285.0" y="126.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#60a5fa">webhook y bandeja</text><rect x="400" y="70" width="195" height="80" rx="12" fill="#111c2e" stroke="#2dd4bf" stroke-width="2" /><text x="497.5" y="106.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Reglas</text><text x="497.5" y="126.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2dd4bf">determinista: valida y decide</text><rect x="635" y="70" width="215" height="80" rx="12" fill="#111c2e" stroke="#a78bfa" stroke-width="2" /><text x="742.5" y="106.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Agente de IA</text><text x="742.5" y="126.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a78bfa">probabilístico: extrae y redacta</text><rect x="885" y="70" width="195" height="80" rx="12" fill="#111c2e" stroke="#fbbf24" stroke-width="2" /><text x="982.5" y="106.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Herramientas</text><text x="982.5" y="126.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#fbbf24">ERP, CRM, catálogo, agenda</text><rect x="657" y="215" width="170" height="70" rx="12" fill="#111c2e" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 5" /><text x="742.0" y="246.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Persona</text><text x="742.0" y="266.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#f472b6">revisa, corrige, decide</text>
<text x="30" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">La respuesta vuelve al cliente.</text>
<text x="30" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">Si el caso lo pide, pasa a una persona.</text>
</svg>